<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel Kawalan Urus Setia</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-800 min-h-screen p-4 text-white flex items-center justify-center">

  <div class="max-w-md w-full bg-gray-900 rounded-xl p-6 shadow-2xl border border-gray-700 space-y-5">
    <div class="text-center space-y-1">
      <h1 class="text-2xl font-bold text-amber-500">🛡️ PANEL KAWALAN</h1>
      <p class="text-xs text-gray-400">Hantar Pengumuman / Notifikasi Terus Ke Telefon Penguji</p>
    </div>

    <div class="space-y-2">
      <label class="block text-sm font-semibold">Mesej Pengumuman:</label>
      <textarea id="mesejNotif" rows="4" class="w-full bg-gray-800 border border-gray-600 rounded p-3 text-white focus:outline-none focus:border-amber-500" placeholder="Contoh: Sila rehat 15 minit untuk Solat Asar..."></textarea>
    </div>

    <button type="button" onclick="hantarPengumuman()" class="w-full bg-amber-500 hover:bg-amber-600 text-gray-950 py-3 rounded-lg font-bold text-base shadow flex items-center justify-center gap-2">
      🚀 HANTAR NOTIFIKASI POP-UP
    </button>

    <div id="status" class="text-center text-xs font-semibold py-1"></div>
  </div>

  <script>
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwY9046JYw5VTlaxjKpEwD6T6oKidCQURrqHuU0ZMPwMdbwMWR832RGIX5PCMB0s3UTQw/exec"; 

    async function hantarPengumuman() {
      const mesej = document.getElementById('mesejNotif').value.trim();
      const status = document.getElementById('status');

      if (!mesej) return alert('Sila taip mesej dahulu.');

      status.innerText = "⏳ Memproses penghantaran...";
      status.className = "text-center text-xs font-semibold py-1 text-amber-400";

      try {
        const payload = {
          action: "hantarNotif",
          mesej: mesej
        };

        const res = await fetch(APPS_SCRIPT_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(payload),
          redirect: "follow"
        });

        const result = await res.json();
        if (result.success) {
          status.innerText = "✅ Pengumuman Berjaya Dihantar!";
          status.className = "text-center text-xs font-semibold py-1 text-green-400";
          document.getElementById('mesejNotif').value = "";
        } else {
          status.innerText = "❌ Gagal: " + result.message;
          status.className = "text-center text-xs font-semibold py-1 text-red-400";
        }
      } catch(e) {
        status.innerText = "❌ Ralat rangkaian.";
        status.className = "text-center text-xs font-semibold py-1 text-red-400";
      }
    }
  </script>
</body>
</html>
