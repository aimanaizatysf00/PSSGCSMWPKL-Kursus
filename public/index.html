<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistem Ujian Kenaikan Bengkung / Tali Pinggang</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .glass-card {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
    }
    /* Sembunyikan spinner input number */
    input[type=number]::-webkit-inner-spin-button, 
    input[type=number]::-webkit-outer-spin-button { 
      -webkit-appearance: none; 
      margin: 0; 
    }
    input[type=number] {
      -moz-appearance: textfield;
    }
  </style>
</head>
<body class="bg-slate-900 text-slate-800 min-h-screen font-sans flex flex-col justify-between">

  <!-- OVERLAY LOADING GLOBAL -->
  <div id="loadingOverlay" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex flex-col items-center justify-center text-white hidden">
    <div class="w-12 h-12 border-4 border-amber-500 border-t-transparent rounded-full animate-spin mb-4"></div>
    <p id="loadingText" class="font-semibold text-lg animate-pulse text-amber-400">Memuatkan data...</p>
  </div>

  <!-- POP-UP NOTIFIKASI PENGUMUMAN -->
  <div id="notifModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-white rounded-2xl p-6 max-w-md w-full shadow-2xl border-t-8 border-amber-500 text-center space-y-4 animate-bounce">
      <div class="text-4xl">📢</div>
      <h3 class="text-xl font-bold text-gray-900">Pengumuman Urus Setia</h3>
      <p id="notifMesej" class="text-gray-700 font-medium text-sm leading-relaxed"></p>
      <button onclick="tutupNotif()" class="w-full py-2.5 bg-amber-600 hover:bg-amber-700 text-white font-bold rounded-xl shadow-md transition">
        Faham & Tutup
      </button>
    </div>
  </div>

  <div class="container mx-auto p-4 max-w-4xl flex-grow">
    
    <!-- HEADER -->
    <header class="bg-slate-800 text-white p-5 rounded-2xl shadow-xl mb-6 flex justify-between items-center border border-slate-700">
      <div>
        <h1 class="text-xl md:text-2xl font-black text-amber-400 tracking-wide">SISTEM PENILAIAN SILAT</h1>
        <p class="text-xs text-slate-400">Ujian Kenaikan Bengkung & Tali Pinggang</p>
      </div>
      <div class="text-right text-xs text-slate-300">
        <div id="devIdTag" class="font-mono bg-slate-900 px-2 py-1 rounded text-amber-300 font-bold">ID: -</div>
      </div>
    </header>

    <!-- LANGKAH 1: PILIHAN PENGUJI & PERINGKAT -->
    <section id="step1" class="bg-white p-6 rounded-2xl shadow-xl space-y-5 border border-slate-200">
      <div class="border-b pb-3 flex justify-between items-center">
        <h2 class="text-lg font-bold text-slate-800 flex items-center gap-2">
          <span class="bg-amber-500 text-white w-6 h-6 rounded-full flex items-center justify-center text-xs">1</span> 
          Tetapan Ujian & Penguji
        </h2>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <div>
          <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Nama Penguji</label>
          <input type="text" id="namaPenguji" placeholder="Cth: Guru Azman" class="w-full p-2.5 border rounded-xl focus:ring-2 focus:ring-amber-500 outline-none text-sm font-semibold">
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Peringkat / Tali Pinggang</label>
          <select id="pilihTaliPinggang" class="w-full p-2.5 border rounded-xl focus:ring-2 focus:ring-amber-500 outline-none text-sm font-semibold bg-white">
            <option value="">-- Pilih Tali Pinggang --</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Gelanggang / Kumpulan</label>
          <input type="text" id="kumpulanUjian" placeholder="Cth: K1 / Pusat" class="w-full p-2.5 border rounded-xl focus:ring-2 focus:ring-amber-500 outline-none text-sm font-semibold">
        </div>
      </div>

      <div class="flex justify-end pt-2">
        <button onclick="keLangkah2()" class="bg-amber-600 hover:bg-amber-700 text-white font-bold px-6 py-2.5 rounded-xl shadow-lg transition flex items-center gap-2 text-sm">
          Seterusnya: Pilih Pesilat ➔
        </button>
      </div>
    </section>

    <!-- LANGKAH 2: PILIH PESILAT -->
    <section id="step2" class="bg-white p-6 rounded-2xl shadow-xl space-y-5 border border-slate-200 hidden">
      <div class="border-b pb-3 flex justify-between items-center">
        <h2 class="text-lg font-bold text-slate-800 flex items-center gap-2">
          <span class="bg-amber-500 text-white w-6 h-6 rounded-full flex items-center justify-center text-xs">2</span> 
          Pilih Senarai Pesilat
        </h2>
        <span id="labelTaliPinggangDipilih" class="text-xs bg-amber-100 text-amber-800 font-bold px-3 py-1 rounded-full"></span>
      </div>

      <div class="space-y-3">
        <div class="flex justify-between items-center">
          <p class="text-xs text-slate-500">Tanda pesilat yang mengambil ujian dalam sesi ini:</p>
          <button onclick="toggleSemuaPesilat()" class="text-xs font-bold text-amber-600 hover:underline">Pilih Semua / Batal</button>
        </div>
        <div id="senaraiPesilatContainer" class="max-h-80 overflow-y-auto space-y-2 border rounded-xl p-3 bg-slate-50">
          <!-- Senarai Pesilat Dijana Automatik -->
        </div>
      </div>

      <div class="flex justify-between pt-2">
        <button onclick="tunjukLangkah(1)" class="bg-slate-300 hover:bg-slate-400 text-slate-800 font-bold px-5 py-2.5 rounded-xl transition text-sm">
          ⬅ Kembali
        </button>
        <button onclick="ciptaSesiUjian()" class="bg-green-600 hover:bg-green-700 text-white font-bold px-6 py-2.5 rounded-xl shadow-lg transition flex items-center gap-2 text-sm">
          Mula Penilaian ➔
        </button>
      </div>
    </section>

    <!-- LANGKAH 3: BORANG PENILAIAN MARKAH -->
    <section id="step3" class="bg-white p-6 rounded-2xl shadow-xl space-y-5 border border-slate-200 hidden">
      <div class="border-b pb-3 flex justify-between items-center flex-wrap gap-2">
        <div>
          <h2 class="text-lg font-bold text-slate-800">Borang Markah Penilaian</h2>
          <p id="infoSheetBorang" class="text-xs text-amber-600 font-bold font-mono"></p>
        </div>
        <button onclick="simpanMarkah(false)" class="bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold px-4 py-2 rounded-xl transition flex items-center gap-1 shadow">
          💾 Simpan Draf
        </button>
      </div>

      <div id="papanPenilaianContainer" class="space-y-6">
        <!-- Jadual Borang Markah Pesilat Dijana Di Sini -->
      </div>

      <div class="flex justify-between pt-4 border-t">
        <button onclick="tunjukLangkah(2)" class="bg-slate-300 hover:bg-slate-400 text-slate-800 font-bold px-5 py-2.5 rounded-xl transition text-sm">
          ⬅ Edit Pesilat
        </button>
        <button onclick="simpanMarkah(true)" class="bg-green-600 hover:bg-green-700 text-white font-bold px-8 py-3 rounded-xl shadow-xl transition flex items-center gap-2 text-sm">
          ✅ Hantar Markah Akhir
        </button>
      </div>
    </section>

  </div>

  <footer class="text-center p-4 text-xs text-slate-500">
    Sistem Penilaian Silat &copy; 2026 - Versi Web Apps
  </footer>

  <script>
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzxS0EZTuF2dKVyV_PNi6Pdn1Qjvw40JccYfboFjQg9AAhcRvHC1R6ylOmpXZbpVGs12Q/exec";

    let DB_PESILAT = [];
    let DB_TETAPAN = {};
    let PESILAT_TERPILIH = [];
    let CURRENT_SHEET_TITLE = "";
    let LAST_NOTIF_ID = 0;
    
    // Jana ID Peranti Unik
    let DEVICE_ID = localStorage.getItem('SILAT_DEV_ID');
    if (!DEVICE_ID) {
      DEVICE_ID = 'DEV_' + Math.random().toString(36).substring(2, 8).toUpperCase();
      localStorage.setItem('SILAT_DEV_ID', DEVICE_ID);
    }

    window.onload = async function() {
      document.getElementById('devIdTag').innerText = "ID: " + DEVICE_ID;
      await muatDataAwal();
      setInterval(pingStatusAndNotif, 5000);
    };

    function showLoading(msg = "Memuatkan...") {
      document.getElementById('loadingText').innerText = msg;
      document.getElementById('loadingOverlay').classList.remove('hidden');
    }

    function hideLoading() {
      document.getElementById('loadingOverlay').classList.add('hidden');
    }

    // MUAT DATA PESILAT & TETAPAN
    async function muatDataAwal() {
      showLoading("Memuatkan Pangkalan Data...");
      try {
        const res = await fetch(APPS_SCRIPT_URL);
        const data = await res.json();
        
        if (data.success) {
          DB_PESILAT = data.pesilat || [];
          DB_TETAPAN = data.tetapan || {};
          isiDropdownTaliPinggang();
        } else {
          alert("Gagal muat data: " + data.message);
        }
      } catch (e) {
        alert("Ralat Rangkaian semasa muat data. Pastikan URL Web App tepat dan telah di-Deploy sebagai 'Anyone'.");
      } finally {
        hideLoading();
      }
    }

    function isiDropdownTaliPinggang() {
      const select = document.getElementById('pilihTaliPinggang');
      select.innerHTML = '<option value="">-- Pilih Tali Pinggang --</option>';
      Object.keys(DB_TETAPAN).forEach(tp => {
        const opt = document.createElement('option');
        opt.value = tp;
        opt.textContent = tp;
        select.appendChild(opt);
      });
    }

    function tunjukLangkah(no) {
      [1, 2, 3].forEach(i => {
        document.getElementById(`step${i}`).classList.toggle('hidden', i !== no);
      });
    }

    function keLangkah2() {
      const penguji = document.getElementById('namaPenguji').value.trim();
      const tp = document.getElementById('pilihTaliPinggang').value;

      if (!penguji || !tp) {
        return alert("Sila lengkapkan Nama Penguji dan Peringkat Tali Pinggang!");
      }

      document.getElementById('labelTaliPinggangDipilih').innerText = tp;
      
      // Tapis Pesilat Mengikut Peringkat
      const tapisPesilat = DB_PESILAT.filter(p => p.peringkat.toLowerCase() === tp.toLowerCase());
      const container = document.getElementById('senaraiPesilatContainer');
      
      if (tapisPesilat.length === 0) {
        container.innerHTML = `<p class="text-center text-sm text-gray-500 py-4">Tiada pesilat ditemui untuk peringkat ini.</p>`;
      } else {
        container.innerHTML = tapisPesilat.map((p, idx) => `
          <label class="flex items-center gap-3 p-2.5 bg-white border rounded-lg hover:bg-amber-50 cursor-pointer transition">
            <input type="checkbox" class="chkPesilat w-4 h-4 text-amber-600 rounded" value="${p.ic}" data-nama="${p.nama}" data-gelanggang="${p.gelanggang}">
            <div class="text-xs">
              <div class="font-bold text-gray-800">${p.nama}</div>
              <div class="text-gray-500">${p.gelanggang} | IC: ${p.ic}</div>
            </div>
          </label>
        `).join('');
      }

      tunjukLangkah(2);
      hantarLogPenguji();
    }

    function toggleSemuaPesilat() {
      const chks = document.querySelectorAll('.chkPesilat');
      const allChecked = Array.from(chks).every(c => c.checked);
      chks.forEach(c => c.checked = !allChecked);
    }

    async function ciptaSesiUjian() {
      const chks = document.querySelectorAll('.chkPesilat:checked');
      if (chks.length === 0) return alert("Sila pilih sekurang-kurangnya seorang pesilat!");

      PESILAT_TERPILIH = Array.from(chks).map(c => ({
        ic: c.value,
        nama: c.getAttribute('data-nama'),
        gelanggang: c.getAttribute('data-gelanggang')
      }));

      const penguji = document.getElementById('namaPenguji').value.trim();
      const tp = document.getElementById('pilihTaliPinggang').value;
      const kump = document.getElementById('kumpulanUjian').value.trim();
      const kriteriaObj = DB_TETAPAN[tp] || { kriteria: [], markahMaks: [] };

      showLoading("Mencipta Sheet Ujian...");

      try {
        const payload = {
          action: 'createSheet',
          penguji: penguji,
          taliPinggang: tp,
          kumpulan: kump,
          kriteriaActive: kriteriaObj.kriteria,
          pesilatPilihan: PESILAT_TERPILIH
        };

        const res = await fetch(APPS_SCRIPT_URL, {
          method: 'POST',
          body: JSON.stringify(payload)
        });
        const data = await res.json();

        if (data.success) {
          CURRENT_SHEET_TITLE = data.sheetTitle;
          document.getElementById('infoSheetBorang').innerText = "Sheet: " + CURRENT_SHEET_TITLE;
          binaBorangMarkah(kriteriaObj);
          tunjukLangkah(3);
          hantarLogPenguji();
        } else {
          alert("Gagal mencipta sheet: " + data.message);
        }
      } catch (e) {
        alert("Ralat semasa mencipta borang ujian.");
      } finally {
        hideLoading();
      }
    }

    function binaBorangMarkah(kriteriaObj) {
      const container = document.getElementById('papanPenilaianContainer');
      const kriteria = kriteriaObj.kriteria || [];
      const maks = kriteriaObj.markahMaks || [];

      container.innerHTML = PESILAT_TERPILIH.map((p, pIdx) => `
        <div class="bg-slate-50 border rounded-2xl p-4 shadow-sm space-y-3">
          <div class="flex justify-between items-center border-b pb-2">
            <div>
              <h3 class="font-bold text-gray-900 text-sm">${pIdx + 1}. ${p.nama}</h3>
              <p class="text-xs text-gray-500">${p.gelanggang} | ${p.ic}</p>
            </div>
            <div class="text-right">
              <span class="text-xs text-gray-500 block">Jumlah</span>
              <span id="jumlahMarkah_${pIdx}" class="text-lg font-black text-amber-600">0</span>
            </div>
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
            ${kriteria.map((k, kIdx) => `
              <div class="bg-white p-2.5 rounded-xl border space-y-1">
                <div class="flex justify-between text-xs font-semibold text-gray-700">
                  <span>${k}</span>
                  <span class="text-gray-400">Maks: ${maks[kIdx] || 0}</span>
                </div>
                <input type="number" 
                       min="0" 
                       max="${maks[kIdx] || 100}" 
                       data-pidx="${pIdx}" 
                       data-kidx="${kIdx}"
                       oninput="kiraJumlahPesilat(${pIdx})"
                       class="inputMarkah_${pIdx} w-full border rounded-lg p-2 text-center font-bold text-sm focus:ring-2 focus:ring-amber-500 outline-none" 
                       placeholder="0">
              </div>
            `).join('')}
          </div>
        </div>
      `).join('');
    }

    function kiraJumlahPesilat(pIdx) {
      const inputs = document.querySelectorAll(`.inputMarkah_${pIdx}`);
      let total = 0;
      inputs.forEach(inp => {
        total += Number(inp.value) || 0;
      });
      document.getElementById(`jumlahMarkah_${pIdx}`).innerText = total;
    }

    async function simpanMarkah(isFinal = false) {
      showLoading(isFinal ? "Menghantar Markah Akhir..." : "Menyimpan Draf...");

      const dataMarkah = PESILAT_TERPILIH.map((p, pIdx) => {
        const inputs = document.querySelectorAll(`.inputMarkah_${pIdx}`);
        const markahArr = Array.from(inputs).map(i => Number(i.value) || 0);
        const jumlah = markahArr.reduce((a, b) => a + b, 0);

        return {
          nama: p.nama,
          ic: p.ic,
          gelanggang: p.gelanggang,
          markahArray: markahArr,
          jumlah: jumlah
        };
      });

      try {
        const payload = {
          action: 'simpanMarkah',
          sheetTitle: CURRENT_SHEET_TITLE,
          dataMarkah: dataMarkah
        };

        const res = await fetch(APPS_SCRIPT_URL, {
          method: 'POST',
          body: JSON.stringify(payload)
        });
        const data = await res.json();

        if (data.success) {
          alert(isFinal ? "✅ Markah berjaya dihantar sepenuhnya!" : "💾 Draf berjaya disimpan.");
          if (isFinal) tunjukLangkah(1);
        } else {
          alert("Gagal simpan: " + data.message);
        }
      } catch(e) {
        alert("Ralat semasa menyalin markah.");
      } finally {
        hideLoading();
      }
    }

    // PING LOGS & NOTIFIKASI
    async function hantarLogPenguji() {
      const penguji = document.getElementById('namaPenguji')?.value || '-';
      const tp = document.getElementById('pilihTaliPinggang')?.value || '-';

      const payload = {
        action: 'updateDeviceLog',
        deviceId: DEVICE_ID,
        namaPenguji: penguji,
        peringkat: tp,
        pesilat: PESILAT_TERPILIH.map(p => p.nama)
      };

      try {
        const res = await fetch(APPS_SCRIPT_URL, {
          method: 'POST',
          body: JSON.stringify(payload)
        });
        const data = await res.json();
        if (data.forceReset) {
          alert("⚠️ Sesi peranti ini telah di-reset oleh Urus Setia.");
          window.location.reload();
        }
      } catch (e) {}
    }

    async function pingStatusAndNotif() {
      try {
        // 1. Semak Notifikasi
        const resN = await fetch(`${APPS_SCRIPT_URL}?action=getNotif`);
        const dataN = await resN.json();
        if (dataN.success && dataN.notif && dataN.notif.id !== LAST_NOTIF_ID) {
          LAST_NOTIF_ID = dataN.notif.id;
          paparNotif(dataN.notif.message);
        }
        
        // 2. Ping Log
        await hantarLogPenguji();
      } catch(e) {}
    }

    function paparNotif(msg) {
      document.getElementById('notifMesej').innerText = msg;
      document.getElementById('notifModal').classList.remove('hidden');
    }

    function tutupNotif() {
      document.getElementById('notifModal').classList.add('hidden');
    }
  </script>
</body>
</html>
