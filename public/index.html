<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistem Ujian Kenaikan Tali Pinggang</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen p-4 md:p-8">

  <div class="max-w-5xl mx-auto bg-white rounded-xl shadow-md p-6">
    <h1 class="text-2xl font-bold text-center text-red-700 mb-6">Sistem Pemarkahan Ujian Kenaikan Tali Pinggang</h1>

    <!-- LANGKAH 1: MAKLUMAT PENGUJI -->
    <div id="step-1" class="block">
      <h2 class="text-xl font-semibold mb-4 border-b pb-2">Langkah 1: Maklumat Ujian</h2>
      <div class="space-y-4">
        <div>
          <label class="block font-medium mb-1">Nama Penuh Penguji:</label>
          <input type="text" id="namaPenguji" class="w-full border p-2 rounded focus:ring-2 focus:ring-red-500" placeholder="Contoh: Ustaz / Gurulatih Ahmad">
        </div>
        <div>
          <label class="block font-medium mb-1">Gred Tali Pinggang Ujian:</label>
          <select id="taliPinggang" class="w-full border p-2 rounded">
            <option value="Pra Awan Putih">Pra Awan Putih</option>
            <option value="Awan Putih">Awan Putih</option>
            <option value="Awan Putih Cula 1">Awan Putih Cula 1</option>
            <option value="Awan Putih Cula 2">Awan Putih Cula 2</option>
          </select>
        </div>
        <div>
          <label class="block font-medium mb-1">Kumpulan:</label>
          <select id="kumpulan" class="w-full border p-2 rounded">
            <option value="Kumpulan 1">Kumpulan 1</option>
            <option value="Kumpulan 2">Kumpulan 2</option>
            <option value="Kumpulan 3">Kumpulan 3</option>
            <option value="Kumpulan 4">Kumpulan 4</option>
            <option value="Kumpulan 5">Kumpulan 5</option>
          </select>
        </div>
        <button onclick="bukaModal(1)" class="w-full bg-red-600 text-white py-2 rounded font-semibold hover:bg-red-700">Seterusnya</button>
      </div>
    </div>

    <!-- LANGKAH 2: PILIH PESILAT -->
    <div id="step-2" class="hidden">
      <h2 class="text-xl font-semibold mb-4 border-b pb-2">Langkah 2: Pilih Pesilat Under Ujian</h2>
      <div class="mb-4">
        <input type="text" id="cariPesilat" onkeyup="tapisPesilat()" placeholder="Cari nama pesilat..." class="w-full border p-2 rounded mb-2">
        <div id="senaraiMaster" class="max-h-60 overflow-y-auto border p-2 rounded space-y-2 bg-gray-50">
          <p class="text-center text-gray-500 py-4">Memuatkan data pesilat...</p>
        </div>
      </div>
      <div class="flex justify-between">
        <button onclick="kembaliLangkah(1)" class="bg-gray-400 text-white px-4 py-2 rounded">Kembali</button>
        <button onclick="bukaModal(2)" class="bg-red-600 text-white px-6 py-2 rounded font-semibold">Sahkan Pesilat & Cipta Sheet</button>
      </div>
    </div>

    <!-- LANGKAH 3: LEMBARAN PEMARKAHAN -->
    <div id="step-3" class="hidden">
      <div class="bg-red-50 p-4 rounded border mb-6 text-sm md:text-base flex justify-between items-center">
        <div>
          <p><strong>Penguji:</strong> <span id="dispPenguji"></span></p>
          <p><strong>Tali Pinggang:</strong> <span id="dispTaliPinggang"></span> | <strong>Kumpulan:</strong> <span id="dispKumpulan"></span></p>
        </div>
        <button onclick="bukaModal(3)" class="bg-green-600 hover:bg-green-700 text-white px-5 py-2 rounded-lg font-bold shadow-md flex items-center gap-2">
          💾 Simpan Markah Ke Sheet
        </button>
      </div>

      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse text-sm">
          <thead>
            <tr class="bg-gray-200">
              <th class="p-2 border">Nama Pesilat</th>
              <th class="p-2 border">Gelanggang</th>
              <th class="p-2 border text-center">Asas (15)</th>
              <th class="p-2 border text-center">Elak (15)</th>
              <th class="p-2 border text-center">Kaki (15)</th>
              <th class="p-2 border text-center">Harimau (20)</th>
              <th class="p-2 border text-center">Pukul (20)</th>
              <th class="p-2 border text-center">Lompat (15)</th>
              <th class="p-2 border text-center font-bold bg-yellow-100">Jumlah</th>
            </tr>
          </thead>
          <tbody id="jadualPemarkahan">
            <!-- Borang Pemarkahan Dinamik -->
          </tbody>
        </table>
      </div>

      <div class="mt-6 flex justify-end">
        <button onclick="bukaModal(3)" class="bg-green-600 hover:bg-green-700 text-white px-8 py-3 rounded-lg font-bold text-lg shadow-lg">
          💾 Simpan Markah Akhir
        </button>
      </div>
    </div>
  </div>

  <!-- IN-SCREEN POP-UP MODAL CONFIRMATION -->
  <div id="confirmModal" class="fixed inset-0 bg-black/50 hidden flex items-center justify-center p-4 z-50">
    <div class="bg-white rounded-lg p-6 max-w-md w-full shadow-lg">
      <h3 class="text-lg font-bold mb-2 text-gray-800">Pengesahan Maklumat</h3>
      <p id="modalMessage" class="text-gray-600 mb-6"></p>
      <div class="flex justify-end gap-3">
        <button onclick="tutupModal()" class="px-4 py-2 border rounded text-gray-600 hover:bg-gray-100">Batal</button>
        <button id="modalConfirmBtn" class="px-4 py-2 bg-red-600 text-white rounded hover:bg-red-700">Ya, Sahkan</button>
      </div>
    </div>
  </div>

  <script>
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzpuUNzERAqzgMq3Adwys7Cn7B7N4alA1vZC8nc8bv9iegWJNRM4e3iTSB-tNrBmITosQ/exec"; 

    let currentStep = 1;
    let dataMasterPesilat = [];
    let pesilatPilihan = [];
    let currentSheetTitle = "";

    function bukaModal(step) {
      const modal = document.getElementById('confirmModal');
      const msg = document.getElementById('modalMessage');
      const btn = document.getElementById('modalConfirmBtn');

      if (step === 1) {
        const penguji = document.getElementById('namaPenguji').value;
        if (!penguji) return alert('Sila isi nama penguji.');
        msg.innerText = `Adakah anda pasti untuk teruskan sebagai Penguji: "${penguji}"?`;
        btn.onclick = () => { tutupModal(); muatTurunMaster(); tunjukLangkah(2); };
      } else if (step === 2) {
        if (pesilatPilihan.length === 0) return alert('Sila pilih sekurang-kurangnya seorang pesilat.');
        msg.innerText = `Sahkan pilihan ${pesilatPilihan.length} orang pesilat? Sheet baharu akan dicipta dalam Google Sheet.`;
        btn.onclick = () => { tutupModal(); hantarKeGoogleSheet(); };
      } else if (step === 3) {
        msg.innerText = `Hantar dan simpan semua markah terkini ke Google Sheet?`;
        btn.onclick = () => { tutupModal(); simpanMarkahAkhir(); };
      }
      modal.classList.remove('hidden');
    }

    function tutupModal() {
      document.getElementById('confirmModal').classList.add('hidden');
    }

    function tunjukLangkah(step) {
      document.getElementById(`step-${currentStep}`).classList.add('hidden');
      document.getElementById(`step-${step}`).classList.remove('hidden');
      currentStep = step;
    }

    function kembaliLangkah(step) {
      tunjukLangkah(step);
    }

    async function muatTurunMaster() {
      document.getElementById('senaraiMaster').innerHTML = `<p class="text-center text-gray-500 py-4">Memuatkan data pesilat...</p>`;
      try {
        // 'redirect: follow' dimasukkan untuk benarkan pautan Apps Script
        const res = await fetch(APPS_SCRIPT_URL, { redirect: "follow" });
        const result = await res.json();
        if (result.success) {
          dataMasterPesilat = result.data;
          paparSenaraiMaster(dataMasterPesilat);
        } else {
          alert('Gagal: ' + result.message);
        }
      } catch(err) {
        console.error(err);
        alert('Gagal memuatkan data pesilat master daripada Google Sheet.');
      }
    }

    function paparSenaraiMaster(list) {
      const box = document.getElementById('senaraiMaster');
      if(list.length === 0) {
        box.innerHTML = `<p class="text-center text-gray-500 py-4">Tiada data pesilat dijumpai.</p>`;
        return;
      }
      box.innerHTML = list.map((p, idx) => `
        <label class="flex items-center justify-between p-2 bg-white rounded border hover:bg-gray-100 cursor-pointer">
          <div>
            <div class="font-semibold">${p.nama}</div>
            <div class="text-xs text-gray-500">${p.ic} | ${p.gelanggang}</div>
          </div>
          <input type="checkbox" onchange="togglePesilat(${idx}, this.checked)" class="w-5 h-5 accent-red-600">
        </label>
      `).join('');
    }

    function tapisPesilat() {
      const kw = document.getElementById('cariPesilat').value.toLowerCase();
      const filtered = dataMasterPesilat.filter(p => p.nama.toLowerCase().includes(kw) || p.ic.includes(kw));
      paparSenaraiMaster(filtered);
    }

    function togglePesilat(idx, checked) {
      const item = dataMasterPesilat[idx];
      if (checked) {
        pesilatPilihan.push(item);
      } else {
        pesilatPilihan = pesilatPilihan.filter(p => p.ic !== item.ic);
      }
    }

    async function hantarKeGoogleSheet() {
      const payload = {
        penguji: document.getElementById('namaPenguji').value,
        taliPinggang: document.getElementById('taliPinggang').value,
        kumpulan: document.getElementById('kumpulan').value,
        pesilatPilihan: pesilatPilihan
      };

      document.body.style.cursor = 'wait';

      try {
        // Guna text/plain untuk elak CORS pre-flight block
        const res = await fetch(APPS_SCRIPT_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(payload),
          redirect: "follow"
        });

        const result = await res.json();
        document.body.style.cursor = 'default';

        if (result.success) {
          currentSheetTitle = result.sheetTitle;
          binaJadualPemarkahan(payload);
          tunjukLangkah(3);
        } else {
          alert('Gagal mencipta sheet: ' + result.message);
        }
      } catch (err) {
        document.body.style.cursor = 'default';
        alert('Ralat semasa menghantar data ke Google Sheet.');
      }
    }

    function binaJadualPemarkahan(data) {
      document.getElementById('dispPenguji').innerText = data.penguji;
      document.getElementById('dispTaliPinggang').innerText = data.taliPinggang;
      document.getElementById('dispKumpulan').innerText = data.kumpulan;

      const tbody = document.getElementById('jadualPemarkahan');
      tbody.innerHTML = data.pesilatPilihan.map((p, i) => `
        <tr class="border-b">
          <td class="p-2 border font-medium">${p.nama}</td>
          <td class="p-2 border text-xs text-gray-600">${p.gelanggang}</td>
          <td class="p-1 border"><input type="number" max="15" value="0" class="w-12 text-center border p-1 rounded" oninput="kiraTotal(${i})" id="m1_${i}"></td>
          <td class="p-1 border"><input type="number" max="15" value="0" class="w-12 text-center border p-1 rounded" oninput="kiraTotal(${i})" id="m2_${i}"></td>
          <td class="p-1 border"><input type="number" max="15" value="0" class="w-12 text-center border p-1 rounded" oninput="kiraTotal(${i})" id="m3_${i}"></td>
          <td class="p-1 border"><input type="number" max="20" value="0" class="w-12 text-center border p-1 rounded" oninput="kiraTotal(${i})" id="m4_${i}"></td>
          <td class="p-1 border"><input type="number" max="20" value="0" class="w-12 text-center border p-1 rounded" oninput="kiraTotal(${i})" id="m5_${i}"></td>
          <td class="p-1 border"><input type="number" max="15" value="0" class="w-12 text-center border p-1 rounded" oninput="kiraTotal(${i})" id="m6_${i}"></td>
          <td class="p-1 border text-center font-bold bg-yellow-50" id="total_${i}">0</td>
        </tr>
      `).join('');
    }

    function kiraTotal(idx) {
      let sum = 0;
      for (let j = 1; j <= 6; j++) {
        sum += Number(document.getElementById(`m${j}_${idx}`).value || 0);
      }
      document.getElementById(`total_${idx}`).innerText = sum;
    }

    async function simpanMarkahAkhir() {
      let dataMarkah = pesilatPilihan.map((p, i) => {
        return {
          nama: p.nama,
          ic: p.ic,
          gelanggang: p.gelanggang,
          m1: Number(document.getElementById(`m1_${i}`).value || 0),
          m2: Number(document.getElementById(`m2_${i}`).value || 0),
          m3: Number(document.getElementById(`m3_${i}`).value || 0),
          m4: Number(document.getElementById(`m4_${i}`).value || 0),
          m5: Number(document.getElementById(`m5_${i}`).value || 0),
          m6: Number(document.getElementById(`m6_${i}`).value || 0),
          jumlah: Number(document.getElementById(`total_${i}`).innerText || 0)
        };
      });

      const payload = {
        action: 'simpanMarkah',
        sheetTitle: currentSheetTitle,
        dataMarkah: dataMarkah
      };

      document.body.style.cursor = 'wait';

      try {
        const res = await fetch(APPS_SCRIPT_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(payload),
          redirect: "follow"
        });

        const result = await res.json();
        document.body.style.cursor = 'default';

        if (result.success) {
          alert('✅ ' + result.message);
        } else {
          alert('❌ Gagal menyimpan markah: ' + result.message);
        }
      } catch (err) {
        document.body.style.cursor = 'default';
        alert('Ralat rangkaian semasa menyimpan markah.');
      }
    }
  </script>
</body>
</html>
