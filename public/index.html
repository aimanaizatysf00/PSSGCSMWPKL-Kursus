<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistem Ujian Kenaikan Tali Pinggang</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen p-4">

  <div class="max-w-4xl mx-auto space-y-4">
    
    <!-- BANNER SESI AKTIF -->
    <div id="activeSessionCard" class="hidden bg-amber-50 border-l-4 border-amber-500 p-4 rounded-lg shadow-sm flex flex-col sm:flex-row sm:items-center justify-between gap-3">
      <div>
        <div class="text-xs font-bold text-amber-700 uppercase tracking-wide">📌 Sesi Ujian Sedang Berjalan</div>
        <div id="sessionSummary" class="text-sm font-semibold text-gray-800 mt-0.5"></div>
      </div>
      <div class="flex items-center gap-2">
        <button type="button" onclick="pulihkanUjian()" class="bg-amber-600 text-white px-3 py-1.5 rounded text-xs font-bold hover:bg-amber-700">
          ➔ Sambung Ujian
        </button>
        <button type="button" onclick="padamDrafUjian()" class="bg-gray-200 text-gray-600 px-2 py-1.5 rounded text-xs hover:bg-gray-300">
          🗑️
        </button>
      </div>
    </div>

    <!-- UTAMA: KAD SISTEM -->
    <div class="bg-white rounded-xl shadow-md p-6">
      <h1 class="text-2xl font-bold text-center text-red-700 mb-6">SISTEM PEMARKAHAN SILAT</h1>

      <!-- LANGKAH 1 -->
      <div id="step-1" class="space-y-4">
        <h2 class="text-lg font-bold border-b pb-2">Langkah 1: Maklumat Ujian</h2>
        <div>
          <label class="block text-sm font-medium">Nama Penguji</label>
          <input type="text" id="namaPenguji" class="w-full border p-2 rounded mt-1" placeholder="Masukkan nama anda" oninput="simpanDrafUjian()">
        </div>
        <div>
          <label class="block text-sm font-medium">Tali Pinggang / Peringkat</label>
          <select id="taliPinggang" class="w-full border p-2 rounded mt-1" onchange="simpanDrafUjian()">
            <option value="">Memuatkan senarai tali pinggang...</option>
          </select>
        </div>
        <div>
          <label class="block text-sm font-medium">Kumpulan / Sesi</label>
          <input type="text" id="kumpulan" class="w-full border p-2 rounded mt-1" value="Kumpulan 1" oninput="simpanDrafUjian()">
        </div>
        <button type="button" onclick="bukaModal(1)" class="w-full bg-red-600 text-white py-2 rounded font-semibold hover:bg-red-700">Seterusnya ➔</button>
      </div>

      <!-- LANGKAH 2 -->
      <div id="step-2" class="space-y-4 hidden">
        <h2 class="text-lg font-bold border-b pb-2">Langkah 2: Pilih Pesilat</h2>
        <input type="text" id="cariPesilat" oninput="tapisPesilat()" placeholder="Cari nama atau IC..." class="w-full border p-2 rounded">
        <div id="senaraiMaster" class="max-h-60 overflow-y-auto border p-2 rounded space-y-2 bg-gray-50"></div>
        <div class="flex gap-2">
          <button type="button" onclick="kembaliLangkah(1)" class="w-1/2 bg-gray-400 text-white py-2 rounded font-semibold">⬅ Kembali</button>
          <button type="button" onclick="bukaModal(2)" class="w-1/2 bg-red-600 text-white py-2 rounded font-semibold hover:bg-red-700">Seterusnya ➔</button>
        </div>
      </div>

      <!-- LANGKAH 3 -->
      <div id="step-3" class="space-y-4 hidden">
        <h2 class="text-lg font-bold border-b pb-2">Langkah 3: Borang Pemarkahan</h2>
        <div class="bg-gray-100 p-3 rounded text-sm grid grid-cols-3 gap-2 font-medium">
          <div>Penguji: <span id="dispPenguji" class="text-red-600"></span></div>
          <div>Ujian: <span id="dispTaliPinggang" class="text-red-600"></span></div>
          <div>Kumpulan: <span id="dispKumpulan" class="text-red-600"></span></div>
        </div>

        <div class="flex justify-end">
          <button type="button" onclick="bukaModalTambahPesilat()" class="bg-blue-600 text-white px-3 py-1.5 rounded text-sm font-semibold hover:bg-blue-700 flex items-center gap-1">
            ➕ Tambah Pesilat
          </button>
        </div>

        <div class="overflow-x-auto">
          <table class="w-full border-collapse border text-sm text-left">
            <thead id="headJadual" class="bg-gray-200"></thead>
            <tbody id="jadualPemarkahan"></tbody>
          </table>
        </div>

        <div class="flex gap-2">
          <button type="button" onclick="kembaliLangkah(2)" class="w-1/2 bg-gray-400 text-white py-2 rounded font-semibold">⬅ Kembali</button>
          <button type="button" onclick="bukaModal(3)" class="w-1/2 bg-green-600 text-white py-2 rounded font-semibold hover:bg-green-700">💾 Simpan Ke Google Sheet</button>
        </div>
      </div>
    </div>
  </div>

  <!-- POP-UP NOTIFIKASI / PENGUMUMAN URUS SETIA -->
  <div id="notifModal" class="fixed inset-0 bg-black bg-opacity-60 hidden flex items-center justify-center p-4 z-50 animate-bounce-short">
    <div class="bg-white rounded-xl p-6 max-w-sm w-full space-y-4 text-center border-4 border-amber-500 shadow-2xl">
      <div class="text-4xl">📢</div>
      <h3 class="text-lg font-bold text-gray-800">PENGUMUMAN URUS SETIA</h3>
      <div id="notifMesej" class="bg-amber-50 p-3 rounded-lg text-sm font-semibold text-amber-900 border border-amber-200"></div>
      <button type="button" onclick="tutupNotif()" class="w-full py-2 bg-amber-600 text-white rounded-lg font-bold hover:bg-amber-700 shadow">
        Faham & Tutup
      </button>
    </div>
  </div>

  <!-- MODAL PENGESAHAN -->
  <div id="confirmModal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center p-4 z-40">
    <div class="bg-white rounded-lg p-6 max-w-sm w-full space-y-4 text-center">
      <h3 class="text-lg font-bold">Pengesahan</h3>
      <p id="modalMessage" class="text-gray-600 text-sm"></p>
      <div class="flex justify-end gap-2">
        <button type="button" onclick="tutupModal()" class="px-4 py-2 bg-gray-300 rounded text-sm font-semibold">Batal</button>
        <button type="button" id="modalConfirmBtn" class="px-4 py-2 bg-red-600 text-white rounded text-sm font-semibold">Ya, Teruskan</button>
      </div>
    </div>
  </div>

  <!-- MODAL TAMBAH PESILAT -->
  <div id="tambahPesilatModal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center p-4 z-40">
    <div class="bg-white rounded-lg p-6 max-w-md w-full space-y-4">
      <h3 class="text-lg font-bold border-b pb-2">Tambah Pesilat Ke Ujian Ini</h3>
      <input type="text" id="cariTambahPesilat" oninput="tapisPesilatTambah()" placeholder="Cari nama atau IC..." class="w-full border p-2 rounded text-sm">
      <div id="senaraiTambahMaster" class="max-h-60 overflow-y-auto border p-2 rounded space-y-2 bg-gray-50"></div>
      <div class="flex justify-end gap-2 pt-2">
        <button type="button" onclick="tutupModalTambahPesilat()" class="px-4 py-2 bg-gray-300 rounded text-sm font-semibold">Batal</button>
      </div>
    </div>
  </div>

  <script>
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwY9046JYw5VTlaxjKpEwD6T6oKidCQURrqHuU0ZMPwMdbwMWR832RGIX5PCMB0s3UTQw/exec"; 

    let currentStep = 1;
    let dataMasterPesilat = [];
    let tetapanTaliPinggang = {};
    let pesilatPilihan = [];
    let currentSheetTitle = "";
    let activeKriteria = [];
    let activeMarkahMaks = [];
    let lastNotifId = localStorage.getItem("LAST_NOTIF_ID") || "";

    const DRAFT_KEY = "SILAT_EXAM_DRAFT_V1";

    window.onload = async function() {
      try {
        const res = await fetch(APPS_SCRIPT_URL, { redirect: "follow" });
        const result = await res.json();
        if (result.success) {
          dataMasterPesilat = result.pesilat;
          tetapanTaliPinggang = result.tetapan;
          isiDropdownTaliPinggang();
          paparSenaraiMaster(dataMasterPesilat);
          semakDanPaparBannerSesi();

          // Mulakan semakan pengumuman setiap 8 saat
          semakPengumuman();
          setInterval(semakPengumuman, 8000);
        } else {
          alert('Gagal muat tetapan: ' + result.message);
        }
      } catch(e) {
        console.error(e);
        alert('Ralat semasa mengambil data dari Google Sheet.');
      }
    };

    async function semakPengumuman() {
      try {
        const res = await fetch(APPS_SCRIPT_URL + "?action=getNotif");
        const result = await res.json();
        if (result.success && result.notif) {
          // Hanya paparkan jika ada notifikasi baharu (ID berbeza)
          if (result.notif.id !== lastNotifId) {
            document.getElementById('notifMesej').innerText = result.notif.mesej;
            document.getElementById('notifModal').classList.remove('hidden');
            lastNotifId = result.notif.id;
          }
        }
      } catch(e) { console.log('Gagal semak notif', e); }
    }

    function tutupNotif() {
      localStorage.setItem("LAST_NOTIF_ID", lastNotifId);
      document.getElementById('notifModal').classList.add('hidden');
    }

    function isiDropdownTaliPinggang() {
      const select = document.getElementById('taliPinggang');
      select.innerHTML = "";
      const keys = Object.keys(tetapanTaliPinggang);
      if (keys.length === 0) {
        select.innerHTML = `<option value="">Tiada tetapan dijumpai</option>`;
        return;
      }
      keys.forEach(k => { select.innerHTML += `<option value="${k}">${k}</option>`; });
    }

    function semakDanPaparBannerSesi() {
      const rawData = localStorage.getItem(DRAFT_KEY);
      const banner = document.getElementById('activeSessionCard');
      const summary = document.getElementById('sessionSummary');

      if (rawData && currentStep === 1) {
        const draft = JSON.parse(rawData);
        summary.innerText = `${draft.penguji || 'Penguji'} | ${draft.taliPinggang || '-'} (${draft.kumpulan || '-'}) • ${draft.pesilatPilihan ? draft.pesilatPilihan.length : 0} Pesilat`;
        banner.classList.remove('hidden');
      } else {
        banner.classList.add('hidden');
      }
    }

    function simpanDrafUjian() {
      let markahDraft = [];
      if (currentStep === 3) {
        markahDraft = pesilatPilihan.map((p, i) => {
          return activeKriteria.map((_, j) => {
            const el = document.getElementById(`m_${i}_${j}`);
            return el ? Number(el.value || 0) : 0;
          });
        });
      }

      const draftState = {
        currentStep: currentStep,
        penguji: document.getElementById('namaPenguji').value,
        taliPinggang: document.getElementById('taliPinggang').value,
        kumpulan: document.getElementById('kumpulan').value,
        pesilatPilihan: pesilatPilihan,
        currentSheetTitle: currentSheetTitle,
        activeKriteria: activeKriteria,
        activeMarkahMaks: activeMarkahMaks,
        markahDraft: markahDraft
      };

      localStorage.setItem(DRAFT_KEY, JSON.stringify(draftState));
      semakDanPaparBannerSesi();
    }

    function pulihkanUjian() {
      const rawData = localStorage.getItem(DRAFT_KEY);
      if (!rawData) return;

      const draft = JSON.parse(rawData);

      document.getElementById('namaPenguji').value = draft.penguji || '';
      document.getElementById('taliPinggang').value = draft.taliPinggang || '';
      document.getElementById('kumpulan').value = draft.kumpulan || '';
      
      pesilatPilihan = draft.pesilatPilihan || [];
      currentSheetTitle = draft.currentSheetTitle || '';
      activeKriteria = draft.activeKriteria || [];
      activeMarkahMaks = draft.activeMarkahMaks || [];

      paparSenaraiMaster(dataMasterPesilat);
      kemaskiniCheckboxLangkah2();

      const targetStep = draft.currentStep || 1;

      if (targetStep === 3 && activeKriteria.length > 0) {
        kemaskiniPaparanJadual(draft.markahDraft);
      }

      tunjukLangkah(targetStep);
    }

    function kemaskiniCheckboxLangkah2() {
      const checkboxes = document.querySelectorAll('#senaraiMaster input[type="checkbox"]');
      dataMasterPesilat.forEach((m, idx) => {
        if (checkboxes[idx]) {
          checkboxes[idx].checked = pesilatPilihan.some(p => p.ic === m.ic);
        }
      });
    }

    function padamDrafUjian() {
      if (confirm("Pasti mahu memadam draf sesi ini?")) {
        localStorage.removeItem(DRAFT_KEY);
        semakDanPaparBannerSesi();
        tunjukLangkah(1);
      }
    }

    function bukaModal(step) {
      const modal = document.getElementById('confirmModal');
      const msg = document.getElementById('modalMessage');
      const btn = document.getElementById('modalConfirmBtn');

      if (step === 1) {
        const penguji = document.getElementById('namaPenguji').value;
        const tp = document.getElementById('taliPinggang').value;
        if (!penguji) return alert('Sila isi nama penguji.');
        if (!tp) return alert('Sila pilih tali pinggang.');
        msg.innerText = `Teruskan sebagai Penguji: "${penguji}" untuk Ujian "${tp}"?`;
        btn.onclick = () => { tutupModal(); tunjukLangkah(2); };
      } else if (step === 2) {
        if (pesilatPilihan.length === 0) return alert('Sila pilih sekurang-kurangnya seorang pesilat.');
        msg.innerText = `Sahkan pilihan ${pesilatPilihan.length} pesilat? Sheet baharu akan dicipta.`;
        btn.onclick = () => { tutupModal(); hantarKeGoogleSheet(); };
      } else if (step === 3) {
        msg.innerText = `Hantar dan simpan semua markah terkini ke Google Sheet?`;
        btn.onclick = () => { tutupModal(); simpanMarkahAkhir(); };
      }
      modal.classList.remove('hidden');
    }

    function tutupModal() { document.getElementById('confirmModal').classList.add('hidden'); }

    function tunjukLangkah(step) {
      document.getElementById(`step-${currentStep}`).classList.add('hidden');
      document.getElementById(`step-${step}`).classList.remove('hidden');
      currentStep = step;
      simpanDrafUjian();
    }

    function kembaliLangkah(step) { tunjukLangkah(step); }

    function paparSenaraiMaster(list) {
      const box = document.getElementById('senaraiMaster');
      if(list.length === 0) {
        box.innerHTML = `<p class="text-center text-gray-500 py-4">Tiada data pesilat.</p>`;
        return;
      }
      box.innerHTML = list.map((p) => {
        const isChecked = pesilatPilihan.some(item => item.ic === p.ic) ? 'checked' : '';
        return `
          <label class="flex items-center justify-between p-2 bg-white rounded border hover:bg-gray-100 cursor-pointer">
            <div>
              <div class="font-semibold">${p.nama}</div>
              <div class="text-xs text-gray-500">${p.ic} | ${p.gelanggang}</div>
            </div>
            <input type="checkbox" ${isChecked} onchange="togglePesilatByIC('${p.ic}', this.checked)" class="w-5 h-5 accent-red-600">
          </label>
        `;
      }).join('');
    }

    function tapisPesilat() {
      const kw = document.getElementById('cariPesilat').value.toLowerCase();
      const filtered = dataMasterPesilat.filter(p => p.nama.toLowerCase().includes(kw) || p.ic.includes(kw));
      paparSenaraiMaster(filtered);
    }

    function togglePesilatByIC(ic, checked) {
      const item = dataMasterPesilat.find(p => p.ic === ic);
      if (!item) return;

      if (checked) {
        if(!pesilatPilihan.some(p => p.ic === ic)) pesilatPilihan.push(item);
      } else {
        pesilatPilihan = pesilatPilihan.filter(p => p.ic !== ic);
      }
      simpanDrafUjian();
    }

    async function hantarKeGoogleSheet() {
      const tpSelected = document.getElementById('taliPinggang').value;
      const config = tetapanTaliPinggang[tpSelected];
      
      activeKriteria = config.kriteria;
      activeMarkahMaks = config.markahMaks;
      const totalMaks = activeMarkahMaks.reduce((a, b) => a + b, 0);

      const payload = {
        penguji: document.getElementById('namaPenguji').value,
        taliPinggang: tpSelected,
        kumpulan: document.getElementById('kumpulan').value,
        pesilatPilihan: pesilatPilihan,
        kriteriaActive: activeKriteria,
        markahMaksActive: activeMarkahMaks,
        totalMaks: totalMaks
      };

      document.body.style.cursor = 'wait';

      try {
        const res = await fetch(APPS_SCRIPT_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(payload),
          redirect: "follow"
        });

        const result = await res.json();
        document.body.style.cursor = 'default';

        if (result.success) {
          currentSheetTitle = result.sheetTitle;
          binaJadualPemarkahan(payload);
          tunjukLangkah(3);
        } else {
          alert('Gagal: ' + result.message);
        }
      } catch (err) {
        document.body.style.cursor = 'default';
        alert('Ralat semasa menghantar data.');
      }
    }

    function binaJadualPemarkahan(data) {
      document.getElementById('dispPenguji').innerText = data.penguji;
      document.getElementById('dispTaliPinggang').innerText = data.taliPinggang;
      document.getElementById('dispKumpulan').innerText = data.kumpulan;

      let headHtml = `<tr>
        <th class="p-2 border">Nama</th>
        <th class="p-2 border">Gelanggang</th>`;
      
      activeKriteria.forEach((k, idx) => {
        headHtml += `<th class="p-2 border text-center">${k}<br><span class="text-xs font-normal text-gray-600">(${activeMarkahMaks[idx]})</span></th>`;
      });
      
      headHtml += `<th class="p-2 border text-center">Jumlah<br><span class="text-xs font-normal text-gray-600">(${data.totalMaks})</span></th>
        <th class="p-2 border text-center">Tindakan</th>
      </tr>`;
      
      document.getElementById('headJadual').innerHTML = headHtml;

      const tbody = document.getElementById('jadualPemarkahan');
      tbody.innerHTML = data.pesilatPilihan.map((p, i) => {
        let rowHtml = `<tr class="border-b"><td class="p-2 border font-medium">${p.nama}</td><td class="p-2 border text-xs text-gray-600">${p.gelanggang}</td>`;
        
        activeKriteria.forEach((_, j) => {
          rowHtml += `<td class="p-1 border"><input type="number" max="${activeMarkahMaks[j]}" value="0" class="w-12 text-center border p-1 rounded" oninput="kiraTotal(${i})" id="m_${i}_${j}"></td>`;
        });

        rowHtml += `<td class="p-1 border text-center font-bold bg-yellow-50" id="total_${i}">0</td>`;
        rowHtml += `<td class="p-1 border text-center"><button type="button" onclick="buangPesilat(${i})" class="bg-red-100 text-red-600 hover:bg-red-200 px-2 py-1 rounded text-xs font-semibold">❌ Buang</button></td></tr>`;
        return rowHtml;
      }).join('');
    }

    function kemaskiniPaparanJadual(existingMarkah = null) {
      const totalMaks = activeMarkahMaks.reduce((a, b) => a + b, 0);
      
      let markahMasaIni = existingMarkah;
      if (!markahMasaIni) {
        markahMasaIni = pesilatPilihan.map((p, i) => {
          return activeKriteria.map((_, j) => {
            const el = document.getElementById(`m_${i}_${j}`);
            return el ? Number(el.value || 0) : 0;
          });
        });
      }

      binaJadualPemarkahan({
        penguji: document.getElementById('namaPenguji').value,
        taliPinggang: document.getElementById('taliPinggang').value,
        kumpulan: document.getElementById('kumpulan').value,
        pesilatPilihan: pesilatPilihan,
        totalMaks: totalMaks
      });

      markahMasaIni.forEach((mArr, i) => {
        if (i < pesilatPilihan.length) {
          mArr.forEach((val, j) => {
            const el = document.getElementById(`m_${i}_${j}`);
            if (el) el.value = val;
          });
          kiraTotal(i);
        }
      });

      simpanDrafUjian();
    }

    function buangPesilat(index) {
      if (pesilatPilihan.length <= 1) {
        alert("Atas sebab keselamatan, sekurang-kurangnya seorang pesilat mesti kekal.");
        return;
      }

      const disahkan = confirm(`Adakah anda pasti mahu membuang ${pesilatPilihan[index].nama} dari senarai?`);
      if (!disahkan) return;

      pesilatPilihan.splice(index, 1);
      kemaskiniCheckboxLangkah2();
      kemaskiniPaparanJadual();
    }

    function bukaModalTambahPesilat() {
      tapisPesilatTambah();
      document.getElementById('tambahPesilatModal').classList.remove('hidden');
    }

    function tutupModalTambahPesilat() {
      document.getElementById('tambahPesilatModal').classList.add('hidden');
    }

    function tapisPesilatTambah() {
      const kw = document.getElementById('cariTambahPesilat').value.toLowerCase();
      const bakiPesilat = dataMasterPesilat.filter(p => !pesilatPilihan.some(sel => sel.ic === p.ic));
      const filtered = bakiPesilat.filter(p => p.nama.toLowerCase().includes(kw) || p.ic.includes(kw));

      const box = document.getElementById('senaraiTambahMaster');
      if (filtered.length === 0) {
        box.innerHTML = `<p class="text-center text-gray-500 py-4 text-xs">Tiada pesilat lain dijumpai.</p>`;
        return;
      }

      box.innerHTML = filtered.map((p) => `
        <div class="flex items-center justify-between p-2 bg-white rounded border hover:bg-gray-100">
          <div>
            <div class="font-semibold text-sm">${p.nama}</div>
            <div class="text-xs text-gray-500">${p.ic} | ${p.gelanggang}</div>
          </div>
          <button type="button" onclick="pilihPesilatTambahan('${p.ic}')" class="bg-blue-600 text-white px-2 py-1 rounded text-xs font-semibold hover:bg-blue-700">
            ➕ Pilih
          </button>
        </div>
      `).join('');
    }

    function pilihPesilatTambahan(ic) {
      const target = dataMasterPesilat.find(p => p.ic === ic);
      if (target) {
        pesilatPilihan.push(target);
        kemaskiniCheckboxLangkah2();
        kemaskiniPaparanJadual();
        tutupModalTambahPesilat();
      }
    }

    function kiraTotal(idxPesilat) {
      let sum = 0;
      activeKriteria.forEach((_, j) => {
        sum += Number(document.getElementById(`m_${idxPesilat}_${j}`).value || 0);
      });
      document.getElementById(`total_${idxPesilat}`).innerText = sum;
      simpanDrafUjian();
    }

    async function simpanMarkahAkhir() {
      let dataMarkah = pesilatPilihan.map((p, i) => {
        let mArray = activeKriteria.map((_, j) => Number(document.getElementById(`m_${i}_${j}`).value || 0));
        return {
          nama: p.nama,
          ic: p.ic,
          gelanggang: p.gelanggang,
          markahArray: mArray,
          jumlah: Number(document.getElementById(`total_${i}`).innerText || 0)
        };
      });

      const payload = {
        action: 'simpanMarkah',
        sheetTitle: currentSheetTitle,
        dataMarkah: dataMarkah
      };

      document.body.style.cursor = 'wait';

      try {
        const res = await fetch(APPS_SCRIPT_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(payload),
          redirect: "follow"
        });

        const result = await res.json();
        document.body.style.cursor = 'default';

        if (result.success) {
          alert('✅ ' + result.message);
          simpanDrafUjian(); 
        } else {
          alert('❌ Gagal: ' + result.message);
        }
      } catch (err) {
        document.body.style.cursor = 'default';
        alert('Ralat rangkaian.');
      }
    }
  </script>
</body>
</html>
