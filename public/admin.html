<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel Admin - Log Telefon & Kawalan</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #f8f9fa; padding: 20px; }
    .card-log { border-left: 5px solid #0d6efd; margin-bottom: 15px; }
    .status-badge { font-size: 0.8rem; }
  </style>
</head>
<body>

  <div class="container">
    <h2 class="mb-4 text-primary">📊 Dashboard Admin: Log Telefon Penguji</h2>

    <!-- Senarai Telefon Penguji -->
    <div class="card shadow-sm mb-4">
      <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center">
        <h5 class="mb-0">Status Telefon Penguji (Real-Time)</h5>
        <button class="btn btn-sm btn-outline-light" onclick="loadAdminLogs()">🔄 Refresh Log</button>
      </div>
      <div class="card-body">
        <div class="table-responsive">
          <table class="table table-hover align-middle">
            <thead class="table-light">
              <tr>
                <th>Device ID</th>
                <th>Nama Penguji</th>
                <th>Gelanggang</th>
                <th>Peringkat Terkini</th>
                <th>Pesilat Sedang Diuji</th>
                <th>Kemaskini Terakhir</th>
                <th>Tindakan Admin</th>
              </tr>
            </thead>
            <tbody id="logTableBody">
              <tr>
                <td colspan="7" class="text-center text-muted">Mengecas data log...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

<script>
  const GAS_URL = "https://script.google.com/macros/s/AKfycbw8h2DRNtT8cn0hPLJrZCYtk4Vl3RIRsDr3wXyXLigOwdOul6fYamhcy-f6fcRgMvdR_w/exec";

  function loadAdminLogs() {
    fetch(`${GAS_URL}?action=getAdminLogs`)
      .then(res => res.json())
      .then(data => {
        if (data.success) {
          renderLogTable(data.logs);
        }
      })
      .catch(err => console.error("Ralat ambil log:", err));
  }

  function renderLogTable(logs) {
    const tbody = document.getElementById('logTableBody');
    tbody.innerHTML = '';

    const keys = Object.keys(logs);
    if (keys.length === 0) {
      tbody.innerHTML = `<tr><td colspan="7" class="text-center text-muted">Tiada peranti dikesan.</td></tr>`;
      return;
    }

    keys.forEach(devId => {
      const item = logs[devId];
      const tr = document.createElement('tr');

      tr.innerHTML = `
        <td><span class="badge bg-secondary">${item.deviceId}</span></td>
        <td><strong>${item.penguji}</strong></td>
        <td>${item.gelanggang}</td>
        <td><span class="badge bg-info text-dark">${item.peringkat}</span></td>
        <td>${item.pesilat}</td>
        <td><small class="text-muted">${item.lastUpdate}</small></td>
        <td>
          <button class="btn btn-sm btn-warning mb-1" onclick="resetDevice('${item.deviceId}', 'session')">
            🔄 Reset Sesi
          </button>
          <button class="btn btn-sm btn-outline-secondary mb-1" onclick="resetDevice('${item.deviceId}', 'history')">
            🗑️ Clear Noti History
          </button>
        </td>
      `;
      tbody.appendChild(tr);
    });
  }

  function resetDevice(devId, resetType) {
    const actionName = resetType === 'session' ? 'Kembali ke Skrin Utama (Reset Sesi)' : 'Padam Sejarah Notifikasi';
    if (!confirm(`Adakah anda pasti untuk ${actionName} pada telefon [${devId}]?`)) return;

    fetch(GAS_URL, {
      method: 'POST',
      body: JSON.stringify({
        action: 'resetDevice',
        deviceId: devId,
        resetType: resetType
      })
    })
    .then(res => res.json())
    .then(data => {
      alert(data.message);
      loadAdminLogs();
    });
  }

  // Auto-refresh senarai log setiap 5 saat
  setInterval(loadAdminLogs, 5000);
  loadAdminLogs();
</script>

</body>
</html>
